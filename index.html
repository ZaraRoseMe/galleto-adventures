<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galleto Adventures</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a0a00;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:monospace}
    #gc{display:block;image-rendering:pixelated}
    #wrap{position:relative;width:680px;max-width:100vw;border-radius:12px;overflow:hidden;border:2px solid #c8a165}
    #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:rgba(0,0,0,0.85);color:#fff;font-size:13px;letter-spacing:1px}
    #hud span{color:#f5c518}
    #muteBtn{background:transparent;border:1px solid #f5c51888;color:#f5c518;font-family:monospace;font-size:11px;padding:2px 8px;cursor:pointer;border-radius:4px;letter-spacing:1px}
    #overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
    #overlay h2{color:#f5c518;font-size:28px;letter-spacing:3px;text-align:center}
    #overlay .by{color:#f5c518;font-size:12px;letter-spacing:2px;opacity:.8;margin-top:-4px}
    #overlay p{color:#fff;font-size:12px;letter-spacing:1px;text-align:center;opacity:.8}
    #overlay button{padding:9px 28px;background:transparent;border:2px solid #f5c518;color:#f5c518;font-family:monospace;font-size:14px;letter-spacing:2px;cursor:pointer;border-radius:6px;margin-top:4px}
    #overlay button:hover{background:#f5c51822}
    #lvlbanner{position:absolute;top:25%;left:50%;transform:translateX(-50%);color:#f5c518;font-size:18px;letter-spacing:3px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;text-shadow:0 0 8px #000}
  </style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>🐟 CHURUS <span id="score">0</span></div>
    <div>NIVEL <span id="lvl">1</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <button id="muteBtn" onclick="toggleMute()">🔊 MÚSICA</button>
  </div>
  <canvas id="gc" width="680" height="320"></canvas>
  <div id="overlay">
    <h2>🐱 GALLETO ADVENTURES</h2>
    <div class="by">by Zara</div>
    <p style="margin-top:6px">RECOGE CHURUS · EVITA VECINOS</p>
    <p>¡Llega con su dueña <strong style="color:#f5c518">IMO</strong>!</p>
    <p style="font-size:11px;margin-top:2px;opacity:.6">ESPACIO / CLIC para saltar · ← → para moverse</p>
    <button onclick="startGame()">¡JUGAR!</button>
  </div>
  <div id="lvlbanner"></div>
</div>

<script>
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const W=680,H=320;

let audioCtx=null,muted=false,musicNodes=[],musicPlaying=false,musicLoopTimeout=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function toggleMute(){muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇 MÚSICA':'🔊 MÚSICA';if(muted)stopMusic();else if(gameRunning)startMusic();}

const BPM=140,BEAT=60/BPM;
const C4=261.63,D4=293.66,E4=329.63,F4=349.23,G4=392,A4=440,B4=493.88;
const C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99,A5=880,R=0;
const MELODY=[E5,R,E5,R,E5,R,C5,E5,G5,R,R,R,G4,R,R,R,C5,R,R,G4,R,R,E4,R,A4,R,B4,R,A4,G4,E5,G5,A5,R,F5,G5,R,E5,C5,D5,B4,R,R,R,R,R,R,R,C5,R,R,G4,R,R,E4,R,A4,R,B4,R,A4,G4,E5,G5];
const BASS=[C4,R,R,R,G4,R,R,R,C4,R,R,R,G4,R,R,R,A4,R,R,R,E4,R,R,R,F4,R,R,R,C4,R,R,R,F4,R,R,R,C4,R,R,R,A4,R,R,R,E4,R,R,R,A4,R,R,R,E4,R,R,R,F4,R,R,R,C4,R,R,R];
const CHORD=[C4,E4,G4,C4,E4,G4,C4,E4,G4,B4,D5,G4,B4,D5,G4,B4,A4,C5,E5,A4,C5,E5,A4,C5,F4,A4,C5,F4,A4,C5,F4,A4,F4,A4,C5,F4,A4,C5,F4,A4,C4,E4,G4,C4,E4,G4,C4,E4,A4,C5,E5,A4,C5,E5,A4,C5,F4,A4,C5,F4,A4,C5,F4,A4];

function playNote(freq,t,dur,type,vol,master){
  if(!freq)return;const ac=getAudio(),o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(master);o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.linearRampToValueAtTime(0,t+dur*0.85);
  o.start(t);o.stop(t+dur);musicNodes.push(o,g);
}
function scheduleMusic(startTime){
  const ac=getAudio(),master=ac.createGain();
  master.gain.setValueAtTime(0.4,startTime);master.connect(ac.destination);musicNodes.push(master);
  const nd=BEAT/2,len=MELODY.length;
  for(let i=0;i<len;i++){const t=startTime+i*nd;playNote(MELODY[i],t,nd,'square',0.12,master);playNote(BASS[i%BASS.length],t,nd,'triangle',0.09,master);playNote(CHORD[i%CHORD.length],t,nd,'sine',0.05,master);}
  return startTime+len*nd;
}
function startMusic(){
  if(muted||musicPlaying)return;musicPlaying=true;
  const ac=getAudio();if(ac.state==='suspended')ac.resume();
  let next=ac.currentTime+0.05;
  function loop(){if(!musicPlaying||muted)return;stopMusicNodes();next=scheduleMusic(next);musicLoopTimeout=setTimeout(loop,(MELODY.length*(BEAT/2))*1000-200);}
  loop();
}
function stopMusicNodes(){musicNodes.forEach(n=>{try{n.stop&&n.stop();n.disconnect&&n.disconnect();}catch(e){}});musicNodes=[];}
function stopMusic(){musicPlaying=false;if(musicLoopTimeout)clearTimeout(musicLoopTimeout);stopMusicNodes();}

function sfxJump(){if(muted)return;const ac=getAudio(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(300,ac.currentTime);o.frequency.linearRampToValueAtTime(600,ac.currentTime+0.1);g.gain.setValueAtTime(0.15,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+0.15);o.start();o.stop(ac.currentTime+0.15);}
function sfxCollect(){if(muted)return;const ac=getAudio();[523,659,784].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime+i*0.06);g.gain.setValueAtTime(0.12,ac.currentTime+i*0.06);g.gain.linearRampToValueAtTime(0,ac.currentTime+i*0.06+0.1);o.start(ac.currentTime+i*0.06);o.stop(ac.currentTime+i*0.06+0.1);});}
function sfxHit(){if(muted)return;const ac=getAudio(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,ac.currentTime);o.frequency.linearRampToValueAtTime(50,ac.currentTime+0.3);g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+0.3);o.start();o.stop(ac.currentTime+0.3);}
function sfxWin(){if(muted)return;const ac=getAudio();[C5,E5,G5,C5*2].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(f,ac.currentTime+i*0.15);g.gain.setValueAtTime(0.15,ac.currentTime+i*0.15);g.gain.linearRampToValueAtTime(0,ac.currentTime+i*0.15+0.2);o.start(ac.currentTime+i*0.15);o.stop(ac.currentTime+i*0.15+0.2);});}

const IMGS={};
const SOURCES={bg:'bg.png',cat_walk:'cat_walk.png',cat_jump:'cat_jump.png',churu:'churu.png',atun:'atun.png',alacran:'alacran.png',vecino:'vecino.png',vecina:'vecina.png',zara:'zara.png'};
let loaded=0,total=Object.keys(SOURCES).length;
Object.entries(SOURCES).forEach(([k,src])=>{const img=new Image();img.onload=()=>{IMGS[k]=img;loaded++;if(loaded===total)onReady();};img.onerror=()=>{loaded++;if(loaded===total)onReady();};img.src=src;});
function onReady(){if(IMGS.bg)ctx.drawImage(IMGS.bg,0,0,W,H);else{ctx.fillStyle='#c8a165';ctx.fillRect(0,0,W,H);}}

let gameRunning=false,score=0,lives=3,level=1,animId=null,frameCount=0;
let keys={},player,platforms,items,enemies,goal,camX;
const GROUND=H-60,PLAT_H=18;

function makePlatforms(lvl){
  const base=[{x:0,y:GROUND,w:W*4,h:60}];
  const fl=[{x:180,y:GROUND-70,w:100,h:PLAT_H},{x:350,y:GROUND-110,w:110,h:PLAT_H},{x:520,y:GROUND-70,w:90,h:PLAT_H},{x:700,y:GROUND-130,w:120,h:PLAT_H},{x:880,y:GROUND-80,w:100,h:PLAT_H},{x:1050,y:GROUND-120,w:130,h:PLAT_H},{x:1250,y:GROUND-90,w:110,h:PLAT_H},{x:1450,y:GROUND-140,w:100,h:PLAT_H},{x:1650,y:GROUND-80,w:120,h:PLAT_H}];
  if(lvl>=2)fl.push({x:1850,y:GROUND-120,w:100,h:PLAT_H},{x:2050,y:GROUND-80,w:110,h:PLAT_H},{x:2250,y:GROUND-130,w:100,h:PLAT_H});
  return [...base,...fl];
}
function makeItems(lvl){
  const xs=[220,280,380,440,560,730,810,910,980,1080,1180,1300,1390,1480,1570,1680,1750,1880];
  if(lvl>=2)xs.push(1950,2080,2180,2300);
  return xs.map((x,i)=>({x,y:GROUND-100,w:32,h:32,type:['churu','churu','churu','atun','alacran'][i%5],collected:false,bobOffset:i*0.5}));
}
function makeEnemies(lvl){
  const pos=[{x:450,range:80},{x:750,range:100},{x:1100,range:90},{x:1400,range:100},{x:1700,range:80}];
  if(lvl>=2)pos.push({x:1950,range:100},{x:2200,range:90});
  return pos.map((p,i)=>({...p,startX:p.x,dir:1,speed:1.2+lvl*0.3,type:i%2===0?'vecino':'vecina',w:40,h:60,y:GROUND}));
}
function initLevel(lvl){
  camX=0;platforms=makePlatforms(lvl);items=makeItems(lvl);enemies=makeEnemies(lvl);
  goal={x:(lvl>=2?2450:2050)-80,y:GROUND-120,w:55,h:110,reached:false};
  player={x:60,y:GROUND-60,w:50,h:40,vx:0,vy:0,onGround:false,facing:1,jumping:false,invincible:0,frame:0,frameTimer:0};
}
function startGame(){
  score=0;lives=3;level=1;
  document.getElementById('overlay').style.display='none';
  gameRunning=true;initLevel(level);updateHUD();
  if(animId)cancelAnimationFrame(animId);stopMusic();startMusic();loop();
}
function updateHUD(){document.getElementById('score').textContent=score;document.getElementById('lvl').textContent=level;document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives));}

document.addEventListener('keydown',e=>{keys[e.code]=true;if((e.code==='Space'||e.code==='ArrowUp')&&player&&player.onGround&&gameRunning){player.vy=-12;player.onGround=false;player.jumping=true;sfxJump();e.preventDefault();}});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
canvas.addEventListener('click',()=>{if(!gameRunning)return;if(player&&player.onGround){player.vy=-12;player.onGround=false;player.jumping=true;sfxJump();}});
document.addEventListener('touchstart',e=>{if(!gameRunning)return;if(player&&player.onGround){player.vy=-12;player.onGround=false;player.jumping=true;sfxJump();}},{passive:true});

function rectsOverlap(a,b,m){return a.x+m<b.x+b.w&&a.x+a.w-m>b.x&&a.y+m<b.y+b.h&&a.y+a.h-m>b.y;}
function updatePlayer(){
  const p=player;
  if(keys['ArrowLeft']||keys['KeyA']){p.vx=-3.5;p.facing=-1;}else if(keys['ArrowRight']||keys['KeyD']){p.vx=3.5;p.facing=1;}else p.vx*=0.7;
  p.vy+=0.55;p.x+=p.vx;p.y+=p.vy;p.onGround=false;
  platforms.forEach(pl=>{if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+12&&p.vy>=0){p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.jumping=false;}});
  if(p.y>H+50)loseLife();if(p.x<camX)p.x=camX;
  p.frameTimer++;if(p.frameTimer>8){p.frame=(p.frame+1)%2;p.frameTimer=0;}
  if(p.invincible>0)p.invincible--;
  camX=Math.max(0,p.x-160);
}
function updateEnemies(){enemies.forEach(e=>{e.x+=e.dir*e.speed;if(e.x>e.startX+e.range||e.x<e.startX-e.range)e.dir*=-1;if(player.invincible===0&&rectsOverlap(player,e,8))loseLife();});}
function updateItems(){items.forEach(it=>{if(it.collected)return;it.bobOffset+=0.06;it.y=GROUND-100+Math.sin(it.bobOffset)*5;if(rectsOverlap(player,it,10)){it.collected=true;score+=(it.type==='alacran'?5:it.type==='atun'?3:1);sfxCollect();updateHUD();}});}
function checkGoal(){if(!goal.reached&&rectsOverlap(player,goal,10)){goal.reached=true;if(level<2){level++;showBanner('¡NIVEL '+level+'!');setTimeout(()=>{initLevel(level);updateHUD();},1500);}else winGame();}}
function loseLife(){lives--;sfxHit();updateHUD();if(lives<=0)endGame();else{player.invincible=90;player.x=camX+80;player.y=GROUND-80;player.vy=0;}}
function endGame(){gameRunning=false;stopMusic();const ov=document.getElementById('overlay');ov.innerHTML=`<h2 style="color:#f5c518;font-size:24px;letter-spacing:3px;font-family:monospace">GAME OVER</h2><p style="color:#fff;font-size:13px;margin-top:6px;font-family:monospace">Churus: ${score}</p><button onclick="startGame()" style="padding:9px 28px;background:transparent;border:2px solid #f5c518;color:#f5c518;font-family:monospace;font-size:14px;letter-spacing:2px;cursor:pointer;border-radius:6px;margin-top:12px">REINTENTAR</button>`;ov.style.display='flex';}
function winGame(){gameRunning=false;stopMusic();sfxWin();const ov=document.getElementById('overlay');ov.innerHTML=`<h2 style="color:#f5c518;font-size:20px;letter-spacing:2px;font-family:monospace">🎉 ¡GALLETO LLEGÓ CON IMO!</h2><p style="color:#fff;font-size:13px;margin-top:6px;font-family:monospace">Churus: ${score}</p><button onclick="startGame()" style="padding:9px 28px;background:transparent;border:2px solid #f5c518;color:#f5c518;font-family:monospace;font-size:14px;letter-spacing:2px;cursor:pointer;border-radius:6px;margin-top:12px">JUGAR DE NUEVO</button>`;ov.style.display='flex';}
function showBanner(txt){const b=document.getElementById('lvlbanner');b.textContent=txt;b.style.opacity='1';setTimeout(()=>b.style.opacity='0',1400);}

function drawBg(){if(IMGS.bg){const p=camX*0.3%W;ctx.drawImage(IMGS.bg,-p,0,W,H);if(p>0)ctx.drawImage(IMGS.bg,W-p,0,W,H);}else{ctx.fillStyle='#e8d5a0';ctx.fillRect(0,0,W,H);}}
function drawPlatforms(){platforms.forEach(p=>{const sx=p.x-camX;if(sx+p.w<0||sx>W)return;if(p.h>30){ctx.fillStyle='#8B6914';ctx.fillRect(sx,p.y,p.w,p.h);ctx.fillStyle='#a0784f';ctx.fillRect(sx,p.y,p.w,8);for(let i=0;i<p.w;i+=40){ctx.fillStyle='#c8a165';ctx.fillRect(sx+i,p.y,36,6);}}else{ctx.fillStyle='#8B6914';ctx.fillRect(sx,p.y,p.w,p.h);ctx.fillStyle='#c8a165';ctx.fillRect(sx,p.y,p.w,6);ctx.fillStyle='#6b4f10';ctx.fillRect(sx,p.y+6,p.w,p.h-6);}});}
function drawItems(){items.forEach(it=>{if(it.collected)return;const sx=it.x-camX;if(sx<-40||sx>W+40)return;const key=it.type==='churu'?'churu':it.type==='atun'?'atun':'alacran';if(IMGS[key])ctx.drawImage(IMGS[key],sx,it.y,it.w,it.h);else{ctx.fillStyle='#9B59B6';ctx.fillRect(sx,it.y,it.w,it.h);}});}
function drawEnemies(){enemies.forEach(e=>{const sx=e.x-camX;if(sx<-60||sx>W+60)return;const img=IMGS[e.type];ctx.save();if(img){if(e.dir<0){ctx.translate(sx+e.w,0);ctx.scale(-1,1);ctx.drawImage(img,0,e.y-e.h,e.w,e.h);}else ctx.drawImage(img,sx,e.y-e.h,e.w,e.h);}else{ctx.fillStyle='#E74C3C';ctx.fillRect(sx,e.y-e.h,e.w,e.h);}ctx.restore();});}
function drawGoal(){const sx=goal.x-camX;if(sx<-80||sx>W+80)return;if(IMGS.zara&&!goal.reached){ctx.drawImage(IMGS.zara,sx,goal.y,goal.w,goal.h);ctx.fillStyle='#f5c518';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('✨ IMO ✨',sx+goal.w/2,goal.y-8);ctx.textAlign='left';}}
function drawPlayer(){const p=player;if(p.invincible>0&&Math.floor(p.invincible/5)%2===0)return;const sx=p.x-camX,img=p.onGround?IMGS.cat_walk:IMGS.cat_jump;ctx.save();if(img){if(p.facing<0){ctx.translate(sx+p.w,0);ctx.scale(-1,1);ctx.drawImage(img,0,p.y,p.w,p.h);}else ctx.drawImage(img,sx,p.y,p.w,p.h);}else{ctx.fillStyle='#8B6914';ctx.fillRect(sx,p.y,p.w,p.h);}ctx.restore();}
function drawHints(){if(frameCount<200){ctx.fillStyle='rgba(255,255,255,0.65)';ctx.font='11px monospace';ctx.fillText('← → mover   ESPACIO/CLIC saltar',10,H-8);}}
function loop(){if(!gameRunning)return;frameCount++;ctx.clearRect(0,0,W,H);drawBg();drawPlatforms();drawGoal();drawItems();drawEnemies();updatePlayer();updateEnemies();updateItems();checkGoal();drawPlayer();drawHints();animId=requestAnimationFrame(loop);}
onReady();
</script>
</body>
</html>
